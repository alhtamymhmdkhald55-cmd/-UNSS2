name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: unzip -q app.zip -d proj
      - name: Install dependencies
        working-directory: proj
        run: npm install
      - name: Add Android platform
        working-directory: proj
        run: |
          npx cap add android
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp resources/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        working-directory: proj/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anis-apk
          path: proj/android/app/build/outputs/apk/debug/app-debug.apk
